[pytest]
pythonpath = .
testpaths = tests/unit tests/integration tests/adversarial tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
markers =
    external_volume: marks tests that require /Volumes/NO NAME volume mounted
    anyio: mark for anyio async tests
