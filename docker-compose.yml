services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice-ocr-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://invoice_user:${POSTGRES_PASSWORD:-invoice_pass}@db:5432/invoice_db
      - STORAGE_DIR=/data/stored_documents
      - OMP_THREAD_LIMIT=1
      - MAX_OCR_WORKERS=2
      - SUPABASE_URL=${SUPABASE_URL:-http://100.83.83.8:8002}
      - SUPABASE_SYNC_ENABLED=true
      - PROJECT_ROOT=/app
      - OBSIDIAN_VAULT_DIR=/app/obsidian_vault
    volumes:
      - api_data:/data
      - ./api_server.py:/app/api_server.py
      - ./static:/app/static
      - ./invoice_core:/app/invoice_core
      - ./Building_11:/app/Building_11
      - ./comparison_export:/app/comparison_export
      - ./config:/app/config
      - /Users/diokarabaz/Documents/Obsidian Vault/Microinvest-Accounting:/app/obsidian_vault
      - /Volumes:/Volumes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: invoice-ocr-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-invoice_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-invoice_pass}
      - POSTGRES_DB=${POSTGRES_DB:-invoice_db}
    ports:
      # Bind to localhost only — not exposed to the network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice_user} -d ${POSTGRES_DB:-invoice_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  api_data:
  postgres_data:

